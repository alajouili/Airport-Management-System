# ============================================================
# Airport Management System - backend configuration
# ============================================================

spring.application.name=airport-backend
server.port=8080

# ---------- PostgreSQL connection ----------
# Create the database once with:  CREATE DATABASE airport_db;
# ${DB_USERNAME:postgres} means: use the environment variable DB_USERNAME,
# or "postgres" if it is not defined. Same for the password.
spring.datasource.url=jdbc:postgresql://localhost:5432/airport_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
# "validate": Hibernate never creates or changes tables. It only checks at
# startup that every entity matches a table created by Flyway.
# The SQL migration files are the single source of truth for the schema.
spring.jpa.hibernate.ddl-auto=validate
# Close the database session at the end of the service method (good practice).
spring.jpa.open-in-view=false
# Set to true to see every SQL query in the console while learning.
spring.jpa.show-sql=false

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- CORS ----------
# The Angular dev server runs on port 4200 and calls this API on port 8080.
app.cors.allowed-origins=http://localhost:4200
